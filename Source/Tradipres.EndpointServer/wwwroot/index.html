<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tradipres Endpoint Server</title>
    <style>
        :root {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header {
            background: #111827;
            color: #fff;
            padding: 24px 32px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 7px 0 0;
            color: #d1d5db;
        }

        main {
            max-width: 1120px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
        }

        .label {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .value {
            margin-top: 8px;
            font-size: 25px;
            font-weight: 700;
        }

        .ok {
            color: #15803d;
        }

        .error {
            color: #b91c1c;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            background: #111827;
            color: #e5e7eb;
            padding: 18px;
            border-radius: 11px;
        }
    </style>
</head>
<body>
<header>
    <h1>Tradipres Endpoint Server</h1>
    <p>Panel central de equipos y mantenimiento</p>
</header>

<main>
    <div class="grid">
        <div class="card">
            <div class="label">Estado API</div>
            <div id="api" class="value">Comprobando...</div>
        </div>

        <div class="card">
            <div class="label">Base de datos</div>
            <div id="database" class="value">Comprobando...</div>
        </div>

        <div class="card">
            <div class="label">Servidor SQL</div>
            <div id="server" class="value">-</div>
        </div>

        <div class="card">
            <div class="label">Version</div>
            <div id="version" class="value">-</div>
        </div>
    </div>

    <div class="card" style="margin-top:18px">
        <div class="label">Respuesta de /api/status</div>
        <pre id="details">Cargando...</pre>
    </div>
</main>

<script>
async function loadStatus() {
    const api = document.getElementById("api");
    const database = document.getElementById("database");
    const server = document.getElementById("server");
    const version = document.getElementById("version");
    const details = document.getElementById("details");

    try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();

        api.textContent = data.api || "ERROR";
        api.className = "value " + (data.api === "OK" ? "ok" : "error");

        database.textContent = data.baseDatos || "ERROR";
        database.className = "value " + (data.baseDatos === "OK" ? "ok" : "error");

        server.textContent = data.servidorSql || "-";
        version.textContent = data.version || "-";
        details.textContent = JSON.stringify(data, null, 2);
    }
    catch (error) {
        api.textContent = "ERROR";
        api.className = "value error";
        database.textContent = "SIN RESPUESTA";
        database.className = "value error";
        details.textContent = error.toString();
    }
}

loadStatus();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
