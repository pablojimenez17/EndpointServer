<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Acceso — Tradipres Endpoint Manager</title>
  <link rel="stylesheet" href="/css/login.css?v=0.13.0">
</head>
<body>
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark">T</div>
      <div>
        <strong>Tradipres</strong>
        <span>Endpoint Manager</span>
      </div>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="login-subtitle">Acceso restringido a la red interna de Tradipres.</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>Usuario</span>
        <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus required>
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <p id="loginError" class="login-error hidden" role="alert"></p>

      <button id="loginButton" class="button primary" type="submit">Entrar</button>
    </form>

    <p class="login-footer">Tradipres Endpoint Manager</p>
  </main>

  <script src="/js/login.js?v=0.13.0" defer></script>
</body>
</html>
